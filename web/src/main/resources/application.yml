management:
  endpoints:
    web:
      base-path: ${application.api.path}/actuator
      exposure:
        include: health,info,prometheus,loggers
  metrics:
    tags:
      application: ${spring.application.name}
#    health:
#      show-details: always
#      probes:
#        enabled: true
#      group:
#        liveness:
#          show-details: always
#        readiness:
#          show-details: always
  info:
    env:
      enabled: true
#  GET /q/health/live     // Liveness probe (¿está vivo?)
#  GET /q/health/ready    // Readiness probe (¿puede recibir tráfico?)
#  GET /q/health/started  // Startup probe (¿terminó de iniciar?)
info:
  app:
    name: '${spring.application.name}'
    description: '${application.info.description}'
    version: '${application.info.version}'

springdoc:
  api-docs:
    path: '${application.api.path}/openapi'

  swagger-ui:
    path: '${application.api.path}/swagger-ui.html'

server:
  error:
    include-message: always
  port: ${APP_PORT:8081}

logging:
  level:
    'pe.com.relari': ${LOG_LEVEL:TRACE}
## NOTAS SOBRE ESTRUCTURA DE CÓDIGOS:
##
## 1. SIMPLE (Actual):
##    - EM001, EM002, etc.
##    - Ideal para: Monolito simple
##
## 2. CON CANAL (Este archivo):
##    - EM-WEB-001, EM-API-002, EM-MOB-003
##    - Ideal para: Multi-canal (Web, API REST, Mobile)
##    - Ventaja: Identifica de qué canal proviene el error
##
## 3. CON MÓDULO:
##    - EMP-001 (Employee), AUD-001 (Audit), DOC-001 (Document)
##    - Ideal para: Microservicios con módulos independientes
##
## 4. HÍBRIDA (Módulo + Canal):
##    - EMP-WEB-001, EMP-API-002, AUD-WEB-001
##    - Ideal para: Arquitectura compleja con múltiples módulos y canales
#
